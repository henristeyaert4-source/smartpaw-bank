name: Bank, bol.com en Yuki ophalen

on:
  schedule:
    - cron: "15 3 * * *"   # elke nacht 03:15 UTC (= 04:15/05:15 in België), vóór de ochtendcheck van 06:00
  workflow_dispatch:         # ook manueel te starten via Actions → Run workflow
    inputs:
      days:
        description: "Aantal dagen terug ophalen"
        default: "10"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3 PyJWT[crypto]==2.9.0
      - name: Verrichtingen ophalen
        env:
          PONTO_CLIENT_ID: ${{ secrets.PONTO_CLIENT_ID }}
          PONTO_CLIENT_SECRET: ${{ secrets.PONTO_CLIENT_SECRET }}
          PONTO_CERT: ${{ secrets.PONTO_CERT }}
          PONTO_KEY: ${{ secrets.PONTO_KEY }}
          PONTO_KEY_PASSPHRASE: ${{ secrets.PONTO_KEY_PASSPHRASE }}
          PONTO_REFRESH_TOKEN: ${{ secrets.PONTO_REFRESH_TOKEN }}
          REVOLUT_CLIENT_ID: ${{ secrets.REVOLUT_CLIENT_ID }}
          REVOLUT_ISS: ${{ secrets.REVOLUT_ISS }}
          REVOLUT_PRIVATE_KEY: ${{ secrets.REVOLUT_PRIVATE_KEY }}
          REVOLUT_REFRESH_TOKEN: ${{ secrets.REVOLUT_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          DAYS_BACK: ${{ github.event.inputs.days || '10' }}
        run: python fetch_bank.py
      - name: bol.com ophalen
        continue-on-error: true
        env:
          BOL_CLIENT_ID: ${{ secrets.BOL_CLIENT_ID }}
          BOL_CLIENT_SECRET: ${{ secrets.BOL_CLIENT_SECRET }}
        run: python fetch_bol.py
      - name: Yuki (openstaande facturen) ophalen
        continue-on-error: true
        env:
          YUKI_ACCESS_KEY: ${{ secrets.YUKI_ACCESS_KEY }}
          YUKI_ADMIN_ID: ${{ secrets.YUKI_ADMIN_ID }}
        run: python fetch_yuki.py
      - name: Indelen per categorie
        run: python categorize.py
      - name: Opslaan
        run: |
          git config user.name "smartpaw-bank-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Bank $(date -u +%F)"
          git push
